<svg xmlns="http://www.w3.org/2000/svg" width="120" height="90" viewBox="0 0 120 90">
  <defs>
    <clipPath id="canvas">
      <rect x="0" y="0" width="120" height="90" rx="6"/>
    </clipPath>
    <clipPath id="win">
      <rect x="33" y="-19" width="82" height="88" rx="5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="120" height="90" fill="#FAFAFA"/>
    <rect width="120" height="14" fill="#FFF"/>
    <line x1="0" y1="14" x2="120" y2="14" stroke="#E5E5E5" stroke-width="1"/>
