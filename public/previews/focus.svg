      <rect x="41" y="35.5" width="22" height="3" rx="1" fill="#A39BF6"/>
      <rect x="84" y="45" width="26" height="9" rx="3" fill="#7367F0"/>
      <rect x="87" y="48.5" width="16" height="3" rx="1" fill="#FFF" fill-opacity="0.75"/>
      <rect x="33" y="59" width="82" height="10" fill="#F5F5F5"/>
      <line x1="33" y1="59" x2="115" y2="59" stroke="#E5E5E5" stroke-width="1"/>
    </g>
    <rect x="33" y="-19" width="82" height="88" rx="5" fill="none" stroke="#D4D4D4" stroke-width="1"/>
    <!-- widget icon -->
    <circle cx="108.5" cy="78.5" r="5.5" fill="#7367F0"/>
