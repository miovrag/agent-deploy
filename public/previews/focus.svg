    <rect x="8" y="20" width="90" height="5" rx="2" fill="#D4D4D4"/>
    <rect x="8" y="29" width="70" height="4" rx="2" fill="#E5E5E5"/>
    <rect x="8" y="37" width="82" height="4" rx="2" fill="#E5E5E5"/>
    <rect x="8" y="45" width="58" height="4" rx="2" fill="#E5E5E5"/>
    <!-- focus window (taller, partially clipped at top) -->
